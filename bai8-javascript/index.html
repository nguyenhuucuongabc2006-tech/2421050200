<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS - 2</title>
</head>
<body>
   <div>
    Nhập điểm A: <input id="diemA" type="number">
   </div>
   <div>
    Nhập điểm B: <input id="diemB" type="number">
   </div>
   <div>
    Nhập điểm C: <input id="diemC" type="number">
   </div>
   <div>
    <button onclick="tinhDiemChu()">Tính Điểm Chữ</button> 
   </div>
   <div>
     Kết quả: <input id="ketQua" type="text">
  </div>
 
   


    <script>

     
      function tinhDiem(){
        var A = parseFloat(document.getElementById("diemA").value);
        var B = parseFloat(document.getElementById("diemB").value);
        var C = parseFloat(document.getElementById("diemC").value);
        
        //document.write("Điểm A nhập vào là: " + A);
        //document.write("Điểm B nhập vào là: " + B);
        //document.write("Điểm C nhập vào là: " + C);

        document.getElementById("ketQua").value = tinhDiemChu(A, B, C);
      }
      //function

      //không tham số
      function sayHello(){
          document.write("Hello");
      }

      sayHello();
     
      //có tham số
      function sayHello2(ten){
        document.write("<br> Xin chào bạn " + ten);
      }

      sayHello2("Quang Anh");
      sayHello2("Ly");
       
      document.write("<br>");

      function tinhTong(a, b){
        if (isNaN(a) == false && isNaN(b) == false){
          document.write(a+b);
        
        }
      }
      var soThuNhat = prompt("Nhập số thứ 1 ", "");
      var soThuHai = prompt("Nhập số thứ 2 ", "");
      tinhTong(soThuNhat, soThuHai);
      document.write(+tinhTong);

      //Btvn2:
      //Viết hàm tính điểm chữ dựa trên 3 đầu điểm (A,B,C)
      //tong = A*0,6 + B*0,3 + C*0,1 => điểm chữ tương ứng
      

      function tinhDiemChu(A, B, C){
        var tong = A*0.6 + B*0.3 + C*0.1;
        var kq = "";
        if (tong >= 9 && tong <= 10){
            kq = "A+";
        } else if (tong >= 8.5 && tong < 9){
            kq = "A" ;
        } else if (tong >= 8 && tong < 8.5){
            kq = "B+";
        } else if (tong >= 7 && tong < 8){
            kq = "B" ;
        } else if (tong >= 6.5 && tong < 7){
            kq = "C+";
        } else if (tong >= 5.5 && tong < 6.5){
            kq = "C";
        } else if (tong >= 5 && tong < 5.5){
            kq = "D+";
        } else if (tong >= 4 && tong < 5){
            kq = "D";
        } else {
            kq = "F";
        }
      }
      return kq;

       // var B = parseFloat(); 
       // var C = parseFloat();

    </script>
    
</body>
</html>
