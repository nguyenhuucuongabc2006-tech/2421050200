<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai5</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <style>
        /* loại2: internal style*/
      h2{
        /*color dùng để qui định màu chữ*/
        color:red;
      }
      #tieuDe{
        color: orange;
      }

    </style>
</head>
<body>
    <!--Kiểu 1 viết style trong thẻ-->
    <!--Loại 1: Inline style-->
    <h1 style="color: blue">HUMG</h1>
           
    <!--kiểu 2-->
    <h2>Trường đại học Mỏ Địa Chất</h2>
    <h3>Lớp phát triển ứng dụng web 03</h3>
    <!-- selector -->
    <!-- Cách 1: dùng tên thẻ -->
    <!-- Cách 2 dùng id (viết dấu # trước id)-->
    <h2 id="tieuDe">Trường Đại học Mỏ Địa Chất</h2>
    <!-- Cách 3 dùng class (viết dấu . trước class)-->
    <h2 id="tieuDe" class="tieuDe">Trường Đại học Mỏ Địa Chất</h2>
    
    <h3 class="tieuDe2">Phát triển ứng dụng web 03</h3>



</body>
</html>
